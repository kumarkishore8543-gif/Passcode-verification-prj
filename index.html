<!DOCTYPE html>
<html>
    <head>
        <title>Pass Code Project</title>
    </head>
    <body>
        <h2>Dashboard Page</h2>
        <p>Enter your email-id : </p>
        <input placeholder="Enter your email" title="Enter your email" 
          type="email" class="js-gmail">
        <p>Enter your password : </p>
        <input placeholder="Create 6-digit password" title="Enter any 6 digit password"
          type="number" class="js-pass">
        <p class="js-hint"></p>
        <button class="js-submit">Submit</button>
        <p class="js-verify"></p>
        <br>
        <p class="js-next"></p>

        <script src="scripts/indexscript.js"></script>
    </body>
</html>
